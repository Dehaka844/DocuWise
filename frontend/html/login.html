<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DocuWise - Iniciar sesión</title>

    <link rel="stylesheet" href="../css/main.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-container">

            <div class="card auth-card">

                <header class="auth-header">

                    <div class="logo">
                        DocuWise
                    </div>

                    <h1 class="auth-title">
                        Bienvenido de nuevo
                    </h1>

                    <p class="auth-description">
                        Inicia sesión para continuar
                    </p>

                </header>

                <form id="login-form">

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="email"
                        >
                            Email
                        </label>

                        <input
                            class="form-input"
                            type="email"
                            id="email"
                            name="email"
                            placeholder="tu@email.com"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="password"
                        >
                            Contraseña
                        </label>

                        <input
                            class="form-input"
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Tu contraseña"
                            required
                        >

                    </div>

                    <button
                        class="button button-primary form-submit"
                        type="submit"
                    >
                        Iniciar sesión
                    </button>

                </form>

                <div class="auth-footer">

                    ¿No tienes una cuenta?

                    <a href="register.html">
                        Crear cuenta
                    </a>

                </div>

            </div>

        </div>

    </main>

    <script type="module" src="../js/auth-page.js"></script>

</body>

</html>
