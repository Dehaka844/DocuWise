<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DocuWise - Crear cuenta</title>

    <link rel="stylesheet" href="../css/main.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-container">

            <div class="card auth-card">

                <header class="auth-header">

                    <div class="logo">
                        DocuWise
                    </div>

                    <h1 class="auth-title">
                        Crear cuenta
                    </h1>

                    <p class="auth-description">
                        Crea tu cuenta para comenzar
                    </p>

                </header>

                <form id="register-form">

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="name"
                        >
                            Nombre
                        </label>

                        <input
                            class="form-input"
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Tu nombre"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="email"
                        >
                            Email
                        </label>

                        <input
                            class="form-input"
                            type="email"
                            id="email"
                            name="email"
                            placeholder="tu@email.com"
                            required
                        >

                        <div
                            class="field-error"
                            id="email-error"
                            hidden
                        ></div>

                    </div>

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="password"
                        >
                            Contraseña
                        </label>

                        <input
                            class="form-input"
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Tu contraseña"
                            required
                        >

                        <div
                            class="password-requirements"
                            id="password-requirements"
                        >
                            La contraseña debe tener al menos 8 caracteres,
                            incluyendo una letra, un número y un carácter especial.
                            Ejemplo: <strong>qwe1234!</strong>
                        </div>

                    </div>

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="password-confirmation"
                        >
                            Repetir contraseña
                        </label>

                        <input
                            class="form-input"
                            type="password"
                            id="password-confirmation"
                            name="password-confirmation"
                            placeholder="Repite tu contraseña"
                            required
                        >

                        <div
                            class="password-confirmation-error"
                            id="password-confirmation-error"
                            hidden
                        ></div>

                    </div>

                    <button
                        class="button button-primary form-submit"
                        type="submit"
                    >
                        Crear cuenta
                    </button>

                </form>

                <div class="auth-footer">

                    ¿Ya tienes una cuenta?

                    <a href="login.html">
                        Iniciar sesión
                    </a>

                </div>

            </div>

        </div>

    </main>

    <script type="module" src="../js/auth-page.js"></script>

</body>

</html>
